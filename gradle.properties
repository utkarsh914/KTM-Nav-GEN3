# 4 GB heap: packageDebug (zipflinger's APK compressor) OOM'd at 2 GB once the
# native libs grew - Nav SDK libgmm-jni.so (~9 MB) + LiteRT libtensorflowlite_jni.so
# (unstripped, no NDK on the build host) are compressed in-process on the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
